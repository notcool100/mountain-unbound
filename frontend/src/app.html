<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0f14" />
		<meta
			name="description"
			content="Windhorse Expeditions. Small-group Himalayan trekking and expedition guiding for Everest Base Camp, Annapurna Circuit, and Manaslu Circuit. Nepali-owned, permit-licensed, guide-led."
		/>
		%sveltekit.head%
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('windhorse-theme');
					if (stored === 'light' || stored === 'dark') {
						document.documentElement.setAttribute('data-theme', stored);
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
